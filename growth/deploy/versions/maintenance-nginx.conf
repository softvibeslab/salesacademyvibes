# Dedicated Sales Academy Cloud deployment.
server {
    listen 80;
    listen [::]:80;
    server_name salesacademy.softvibes.cloud v1.salesacademy.softvibes.cloud v2.salesacademy.softvibes.cloud v3.salesacademy.softvibes.cloud v4.salesacademy.softvibes.cloud v5.salesacademy.softvibes.cloud;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/softvibes-recovery-acme;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name salesacademy.softvibes.cloud v1.salesacademy.softvibes.cloud v2.salesacademy.softvibes.cloud v3.salesacademy.softvibes.cloud v4.salesacademy.softvibes.cloud v5.salesacademy.softvibes.cloud;
    ssl_certificate /etc/letsencrypt/live/salesacademy.softvibes.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/salesacademy.softvibes.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log off;
    add_header Retry-After 3600 always;
    location / { return 503 "Sales Academy: mantenimiento temporal. Vuelve pronto.\n"; }
}
